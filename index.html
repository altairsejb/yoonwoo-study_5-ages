<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>오늘의 실험</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오늘의 실험">
<meta name="theme-color" content="#FFCE3A">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --sun:#FFCE3A; --ink:#1C2541; --paper:#FFFDF5;
  --tomato:#F25C54; --sky:#3FA7F5; --leaf:#3DBE7B; --grape:#8C6BE8;
  --cat:var(--sky);
  --kid:'Jua','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --plain:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --fs-title:clamp(28px,6.2vmin,60px);
  --fs-body:clamp(20px,4vmin,38px);
  --fs-small:clamp(15px,2.1vmin,19px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--sun);color:var(--ink);font-family:var(--kid);
  overflow:hidden;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#app{
  height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 24px)
          calc(env(safe-area-inset-bottom,0px) + 20px) calc(env(safe-area-inset-left,0px) + 24px);
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--grape);outline-offset:3px}

/* 위쪽 줄 */
.top{display:flex;align-items:center;gap:14px;min-height:68px;flex:none}
.top .grow{flex:1;display:flex;justify-content:center}
.round{
  width:64px;height:64px;flex:none;border-radius:50%;border:4px solid var(--ink);
  background:var(--paper);box-shadow:0 5px 0 var(--ink);font-size:28px;line-height:1;
  display:grid;place-items:center;padding:0;position:relative;
}
.round:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.dots{display:flex;gap:10px}
.dots i{width:22px;height:22px;border-radius:50%;border:4px solid var(--ink);background:var(--paper)}
.dots i.on{background:var(--cat)}
.dots i.now{background:var(--ink)}

/* 가운데 */
.main{flex:1;min-height:0;overflow-y:auto;display:flex;-webkit-overflow-scrolling:touch}
.in{margin:auto;width:100%;max-width:1000px;text-align:center;padding:10px 4px 16px}
h1{font-size:var(--fs-title);font-weight:400;margin:0 0 .6em;line-height:1.25;word-break:keep-all;text-wrap:balance}
p{font-size:var(--fs-body);margin:0;line-height:1.45;word-break:keep-all;text-wrap:balance}

/* 아래 큰 버튼 */
.foot{flex:none;display:flex;justify-content:center;align-items:center;gap:18px;padding-top:14px;flex-wrap:wrap}
.btn{
  font-size:clamp(24px,3.8vmin,36px);min-height:80px;padding:.45em 1.5em;
  border:4px solid var(--ink);border-radius:999px;background:var(--leaf);color:#fff;
  box-shadow:0 8px 0 var(--ink);text-shadow:0 2px 0 rgba(28,37,65,.35);
}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.btn.plain{background:var(--paper);color:var(--ink);text-shadow:none}
.btn[disabled]{background:#E8E2CF;color:#9A957F;box-shadow:0 8px 0 #9A957F;border-color:#9A957F;text-shadow:none}

/* 실험 카드 */
.xcard{
  background:var(--paper);border:5px solid var(--ink);border-radius:30px;
  box-shadow:0 12px 0 var(--ink);overflow:hidden;width:min(100%,clamp(300px,56vmin,500px));margin:0 auto;
}
.xcard .band{background:var(--cat);color:#fff;font-size:clamp(18px,2.6vmin,24px);padding:.45em 1em;
  border-bottom:5px solid var(--ink);text-shadow:0 2px 0 rgba(28,37,65,.35)}
.xcard .pic{font-size:clamp(90px,24vmin,210px);line-height:1.2;padding:.08em 0 0}
.xcard .ttl{font-size:clamp(24px,4.8vmin,44px);padding:0 .6em .7em;line-height:1.25;word-break:keep-all}
.xcard.tilt{transform:rotate(-3deg)}
.xcard.wait{background:#F2E3A6;border-style:dashed;box-shadow:none;color:#6E612C}
.xcard.wait .pic,.xcard:not(.tilt):not(.wait) .pic{padding-top:.25em}

/* 첫 화면 */
.home{display:grid;gap:28px;align-items:center;justify-items:center}
@media (orientation:landscape) and (min-width:800px){.home{grid-template-columns:1fr 1fr}}
.buddy{display:flex;flex-direction:column;align-items:center;gap:6px}
.buddy svg{width:clamp(120px,28vmin,250px);height:auto}
.bubble{
  background:var(--paper);border:4px solid var(--ink);border-radius:26px;padding:.7em 1em;
  font-size:var(--fs-body);line-height:1.4;position:relative;max-width:520px;word-break:keep-all;text-wrap:balance;
}
.bubble::after{content:"";position:absolute;left:50%;bottom:-16px;width:24px;height:24px;margin-left:-12px;
  background:var(--paper);border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(45deg)}
.hold-hint{font-family:var(--plain);font-size:13px;font-weight:600;position:absolute;top:72px;right:-10px;width:84px;text-align:center;line-height:1.25;pointer-events:none}
.round.holding{background:var(--sky)}

/* 준비물 */
.mats{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.mat{background:var(--paper);border:4px solid var(--ink);border-radius:24px;padding:16px 10px 14px;width:clamp(130px,25vmin,220px)}
.mat b{display:block;font-size:clamp(48px,12vmin,104px);line-height:1.15;font-weight:400}
.mat span{font-size:clamp(18px,3.3vmin,30px);line-height:1.25;display:block;word-break:keep-all}
.tip{font-family:var(--plain);font-size:var(--fs-small);line-height:1.5;margin:22px auto 0;max-width:640px;
  background:rgba(255,253,245,.6);border:2px dashed var(--ink);border-radius:14px;padding:10px 14px;text-align:left;
  -webkit-user-select:text;user-select:text}
.tip strong{font-weight:700}

/* 고르기 */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;margin-top:8px}
.opt{background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);
  padding:22px 12px 20px;font-size:clamp(22px,4vmin,38px);line-height:1.25;word-break:keep-all;min-height:clamp(150px,30vmin,260px)}
.opt b{display:block;font-size:clamp(54px,14vmin,124px);line-height:1.15;font-weight:400}
.opt:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
.opt.sel{background:var(--cat);color:#fff;text-shadow:0 2px 0 rgba(28,37,65,.35);transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}

/* 순서 */
.steps{display:grid;gap:18px;max-width:900px;margin:0 auto;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:18px;background:var(--paper);border:4px solid var(--ink);border-radius:22px;
  padding:20px 24px;text-align:left;font-size:var(--fs-body);line-height:1.35;word-break:keep-all}
.steps .n{flex:none;width:64px;height:64px;border-radius:50%;background:var(--cat);color:#fff;border:4px solid var(--ink);
  display:grid;place-items:center;font-size:30px}

/* 왜 그럴까 */
.verdict{font-size:var(--fs-body);margin-bottom:16px}
.why{background:var(--paper);border:4px solid var(--ink);border-radius:26px;padding:24px 28px;max-width:900px;margin:0 auto;
  font-size:var(--fs-body);line-height:1.5;word-break:keep-all;display:flex;gap:18px;align-items:center;text-align:left}
.why b{font-size:clamp(60px,11vmin,96px);font-weight:400;line-height:1;flex:none}
.note{font-size:clamp(18px,3vmin,28px);margin-top:16px}
.eng{margin-top:20px;display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);
  border:0;border-radius:999px;padding:14px 30px;font-size:clamp(22px,4vmin,38px)}
.eng small{font-size:.75em;opacity:.8}
.eng:active{transform:scale(.97)}

/* 축하 */
.pop{animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.2) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(-3deg);opacity:1}}
.newbadge{display:inline-flex;align-items:center;gap:12px;background:var(--paper);border:4px solid var(--ink);border-radius:999px;
  padding:8px 24px 8px 12px;font-size:var(--fs-body);margin-top:28px}
.newbadge b{font-size:1.5em;font-weight:400}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-30px;width:16px;height:24px;border-radius:4px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* 도감 */
.dexhead{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:22px}
.badge{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 16px 6px 10px;
  font-size:clamp(16px,2.3vmin,21px);display:inline-flex;gap:8px;align-items:center}
.badge.off{opacity:.38}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.tile{background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);
  padding:0 0 12px;overflow:hidden;font-size:clamp(16px,2.2vmin,20px);line-height:1.25;word-break:keep-all}
.tile i{display:block;height:16px;background:var(--cat);border-bottom:4px solid var(--ink)}
.tile b{display:block;font-size:clamp(46px,8vmin,64px);font-weight:400;line-height:1.3}
.tile span{display:block;padding:0 8px}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.tile.lock{background:#F2E3A6;box-shadow:none;border-style:dashed;color:#8A7A3A}
.tile.lock i{background:transparent;border-color:transparent}

/* 어른 화면 */
.parent{font-family:var(--plain);text-align:left;max-width:720px;-webkit-user-select:text;user-select:text}
.parent h1{font-family:var(--kid)}
.parent h2{font-size:20px;margin:28px 0 10px}
.parent p,.parent label,.parent td,.parent th{font-size:17px;line-height:1.5}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:16px 18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid rgba(28,37,65,.15)}
.row:last-child{border-bottom:0}
.parent input[type=text]{font:inherit;font-size:18px;padding:10px 12px;border:3px solid var(--ink);border-radius:12px;width:180px;
  background:#fff;-webkit-user-select:text;user-select:text}
.sw{width:64px;height:38px;border-radius:999px;border:3px solid var(--ink);background:#DDD6BE;position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--ink);transition:left .15s}
.sw[aria-checked=true]{background:var(--leaf)}
.sw[aria-checked=true]::after{left:29px}
.pbtn{font-family:var(--plain);font-size:16px;font-weight:600;padding:10px 16px;border:3px solid var(--ink);border-radius:12px;background:#fff}
.pbtn.warn{background:var(--tomato);color:#fff}
.pbtn:active{transform:translateY(2px)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid rgba(28,37,65,.15);vertical-align:top}
th{font-weight:600}
.miss{color:var(--tomato);font-weight:600}

@media (prefers-reduced-motion:reduce){.pop,.confetti i{animation:none}.confetti{display:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ───────── 실험 카드 ─────────
   e 그림 / t 제목 / m 준비물 / tip 어른에게 / q 질문 / o 보기 / a 보통 나오는 결과
   s 순서 / w 까닭 / en 오늘의 영어 단어 */
const CATS={
  water:{name:'물 실험',e:'💧',c:'#3FA7F5'},
  color:{name:'색깔 실험',e:'🎨',c:'#FF7AA8'},
  light:{name:'빛 실험',e:'🔦',c:'#FF9F1C'},
  air:{name:'공기 실험',e:'🎈',c:'#35B8C9'},
  force:{name:'힘 실험',e:'🚗',c:'#F25C54'},
  sound:{name:'소리 실험',e:'🎵',c:'#8C6BE8'},
  kitchen:{name:'부엌 실험',e:'🧪',c:'#3DBE7B'}
};
const CARDS=[
{id:'apple',cat:'water',e:'🍎',t:'사과는 물에 뜰까?',
 m:[['🍎','사과'],['🥣','큰 그릇'],['💧','물']],
 tip:'바닥이 젖을 수 있으니 수건을 깔아 주세요.',
 q:'사과를 물에 넣으면 어떻게 될까?',o:[['⬆️','둥둥 뜬다'],['⬇️','가라앉는다']],a:0,
 s:['큰 그릇에 물을 가득 담아.','사과를 살짝 넣어 봐.','뜨는지 가라앉는지 잘 봐.'],
 w:'사과 속에는 작은 공기 방이 아주 많아. 그래서 물보다 가벼워서 둥둥 떠.',en:['float','뜨다']},

{id:'volcano',cat:'kitchen',e:'🌋',t:'부글부글 화산',
 m:[['🥄','베이킹소다'],['🍶','식초'],['🥤','컵'],['🍽️','쟁반']],
 tip:'거품이 눈에 튀지 않게 얼굴을 가까이 대지 않도록 해 주세요. 식초에 식용 색소를 타면 더 화산 같아요.',
 q:'베이킹소다에 식초를 부으면 어떻게 될까?',o:[['🌋','거품이 부글부글'],['😴','아무 일도 없다']],a:0,
 s:['쟁반 위에 컵을 올려.','컵에 베이킹소다를 두 숟가락 넣어.','식초를 쪼르륵 부어 봐!'],
 w:'베이킹소다와 식초가 만나면 공기 방울이 아주 많이 생겨. 그 방울들이 거품이 되어 넘치는 거야.',en:['bubble','방울']},

{id:'shadow',cat:'light',e:'🔦',t:'커지는 그림자',
 m:[['🔦','손전등'],['🧸','장난감'],['🧱','빈 벽']],
 tip:'휴대폰 플래시를 써도 돼요. 빛을 눈에 직접 비추지 않게 해 주세요.',
 q:'손전등을 장난감 가까이 가져가면 그림자는?',o:[['🐘','커진다'],['🐭','작아진다']],a:0,
 s:['방을 어둡게 하고 벽 앞에 장난감을 세워.','손전등으로 장난감을 비춰 그림자를 만들어.','손전등을 가까이, 또 멀리 움직여 봐.'],
 w:'빛이 가까이 오면 장난감이 빛을 더 많이 가려. 그래서 그림자가 커져.',en:['shadow','그림자']},

{id:'ramp',cat:'force',e:'🚗',t:'미끄럼틀 자동차',
 m:[['🚗','장난감 자동차'],['📚','책 여러 권'],['📏','판자나 큰 책']],
 tip:'자동차를 밀지 말고 손만 떼게 해 주세요. 그래야 높이만 다르게 비교할 수 있어요.',
 q:'미끄럼틀을 더 높이면 자동차는?',o:[['🏁','더 멀리 간다'],['🐢','덜 간다']],a:0,
 s:['책 한 권에 판자를 걸쳐 낮은 미끄럼틀을 만들어.','자동차를 놓고 어디까지 가는지 봐.','책을 더 쌓아 높게 만들고 다시 놓아 봐.'],
 w:'높은 곳에서 출발하면 자동차가 더 빨라져. 빨라진 만큼 더 멀리 가.',en:['fast','빠른']},

{id:'redyellow',cat:'color',e:'🎨',t:'빨강과 노랑이 만나면',

 s:['종이에 빨강 물감을 동그랗게 짜.','바로 옆에 노랑 물감을 짜.','두 색을 빙글빙글 섞어 봐.'],
 w:'빨강과 노랑이 섞이면 주황색이 돼. 색은 섞으면 새로운 색으로 변해.',en:['orange','주황색']},

{id:'static',cat:'force',e:'🎈',t:'풍선 마술',
 m:[['🎈','풍선'],['🧻','휴지 조각']],
 tip:'습한 날에는 잘 안 될 수 있어요. 마른 머리카락이나 털옷에 문질러 주세요. 풍선이 터지면 조각을 바로 치워 주세요.',
 q:'머리카락에 문지른 풍선을 휴지 조각에 대면?',o:[['🧲','달라붙는다'],['😴','그대로 있다']],a:0,
 s:['휴지를 작게 찢어 책상에 뿌려.','풍선을 머리카락에 쓱쓱 열 번 문질러.','풍선을 휴지 조각 가까이 가져가 봐.'],
 w:'풍선을 문지르면 정전기라는 힘이 생겨. 이 힘이 가벼운 휴지를 끌어당겨.',en:['balloon','풍선']},

{id:'phone',cat:'sound',e:'📞',t:'실 전화기',
 m:[['🥤','종이컵 두 개'],['🧵','긴 실'],['📎','클립 두 개']],
 tip:'컵 바닥 구멍은 어른이 뚫어 주세요. 실 끝에 클립을 묶으면 빠지지 않아요. 실은 3미터쯤이 좋아요.',
 q:'실을 팽팽하게 당기고 말하면 소리가 들릴까?',o:[['👂','들린다'],['🙉','안 들린다']],a:0,
 s:['종이컵 두 개를 실로 이어. 어른이 도와줘요.','한 명씩 컵을 들고 실이 팽팽해질 때까지 멀어져.','한 명은 컵에 대고 말하고, 한 명은 귀에 대고 들어 봐.'],
 w:'목소리가 컵을 떨리게 하고, 그 떨림이 실을 타고 건너가. 그래서 멀리서도 들려.',en:['sound','소리']},

{id:'ice',cat:'water',e:'🧊',t:'얼음은 물에 뜰까?',

/* ───────── 날짜와 진도 ───────── */
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayNum(){const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);}
const doneCount=()=>Object.keys(S.done).length;
const doneToday=()=>Object.values(S.done).filter(x=>x.d===today()).length;
const allowedToday=()=>1+(S.extra[today()]||0);
const nextCard=()=>CARDS.find(c=>!S.done[c.id]);
function earned(){
  const n=doneCount(),out=[];
  BADGES.forEach(b=>{if(n>=b[0])out.push(b[1]+'|'+b[2]);});
  Object.keys(CATS).forEach(k=>{if(CARDS.filter(c=>c.cat===k).every(c=>S.done[c.id]))out.push(CATS[k].e+'|'+CATS[k].name+' 박사');});
  return out;
}

/* ───────── 말하기 ───────── */
let lastSay=[];
function clean(t){return t.replace(/[\u{1F000}-\u{1FFFF}\u{2190}-\u{2BFF}\u{3030}\u{303D}\u{FE0F}\u{200D}]/gu,' ');}
function pickVoice(lang){
  try{const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace('_','-').startsWith(lang.slice(0,2)));
    return vs.find(v=>v.lang.replace('_','-')===lang)||vs[0]||null;}catch(e){return null;}
}
function say(parts,force){
  lastSay=parts;
  if((!S.voice&&!force)||!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    parts.forEach(p=>{
      const lang=p.lang||'ko-KR',u=new SpeechSynthesisUtterance(clean(p.t));
      u.lang=lang;u.rate=lang==='ko-KR'?0.95:0.8;u.pitch=1.1;
      const v=pickVoice(lang);if(v)u.voice=v;
      speechSynthesis.speak(u);
    });
  }catch(e){}
}
const ko=t=>({t});
if('speechSynthesis' in window){try{speechSynthesis.getVoices();}catch(e){}}

function callName(){
  const n=(S.name||'').trim();if(!n)return '';
  const code=n.charCodeAt(n.length-1);
  if(code<0xAC00||code>0xD7A3)return n+', ';
  return n+((code-0xAC00)%28?'아, ':'야, ');
}

doit(){
  const c=R.card;
  app.innerHTML=`${flowTop(2)}<div class="main"><div class="in" style="--cat:${CATS[c.cat].c}">
      <ol class="steps">${c.s.map((s,i)=>`<li><span class="n">${i+1}</span><span>${s}</span></li>`).join('')}</ol>
    </div></div><div class="foot"><button class="btn" data-act="to" data-v="result">실험 끝!</button></div>`;
  const ord=['하나.','둘.','셋.','넷.'];
  say([ko(c.s.map((s,i)=>ord[i]+' '+s).join(' ')+' 다 했으면 실험 끝 버튼을 눌러.')]);
},
result(){
  const c=R.card,picked=R.res!=null;
  app.innerHTML=`${flowTop(3)}<div class="main"><div class="in" style="--cat:${CATS[c.cat].c}">
      <h1>어떻게 됐어? 본 대로 골라 봐</h1>${optsHTML('res',R.res)}
    </div></div><div class="foot"><button class="btn" data-act="to" data-v="why" ${picked?'':'disabled'}>왜 그럴까?</button></div>`;
  if(!picked)say([ko('어떻게 됐어? 눈으로 본 대로 골라 봐.')]);
},
why(){
  const c=R.card,same=R.pred===R.res,usual=R.res===c.a;
  const verdict=same?'우와, 예상이 딱 맞았어!':'예상이랑 달랐네! 그래서 실험이 재밌는 거야.';
  const note=usual?'':`보통은 "${c.o[c.a][1]}" 쪽이 돼. 실험은 할 때마다 다르게 나올 수 있으니까 다음에 또 해 보자!`;
  app.innerHTML=`${flowTop(4)}<div class="main"><div class="in" style="--cat:${CATS[c.cat].c}">
      <p class="verdict">${verdict}</p>
      <div class="why"><b>${c.o[c.a][0]}</b><span>${c.w}</span></div>
      ${note?`<p class="note">${note}</p>`:''}
      ${S.english?`<div><button class="eng" data-act="eng">🔊 ${c.en[0]} <small>${c.en[1]}</small></button></div>`:''}
    </div></div><div class="foot"><button class="btn" data-act="keep">도감에 넣기</button></div>`;
  const parts=[ko(verdict+' '+c.w+(note?' '+note:''))];
  if(S.english)parts.push(ko(`${c.en[1]}. 영어로는`),{t:c.en[0],lang:'en-US'});
  say(parts);
},
cheer(){
  const c=R.card,nb=R.newBadges||[];
  const conf=Array.from({length:26},(_,i)=>`<i style="left:${(i*37)%100}%;background:${['#F25C54','#3FA7F5','#3DBE7B','#8C6BE8','#FFFDF5','#FF7AA8'][i%6]};animation-delay:${(i%9)*0.12}s"></i>`).join('');
  app.innerHTML=`<div class="confetti">${conf}</div><div class="top"></div><div class="main"><div class="in">
      <h1>도감에 새 카드가 들어갔어!</h1>
      <div class="pop">${cardHTML(c)}</div>
      ${nb.map(b=>{const [e,nm]=b.split('|');return `<div><span class="newbadge"><b>${e}</b>새 배지, ${nm}</span></div>`;}).join('')}
    </div></div><div class="foot"><button class="btn" data-act="home">처음으로</button><button class="btn plain" data-act="dex">📒 내 도감 ${doneCount()}</button></div>`;
  say([ko('도감에 새 카드가 들어갔어!'+(nb.length?' 새 배지도 받았어. '+nb.map(b=>b.split('|')[1]).join(', ')+'!':''))]);
},
dex(){
  const have=earned(),all=[...BADGES.map(b=>b[1]+'|'+b[2]),...Object.values(CATS).map(k=>k.e+'|'+k.name+' 박사')];
  app.innerHTML=`<div class="top"><button class="round" data-act="home" aria-label="처음으로">←</button><div class="grow"></div><div style="width:64px"></div></div>
    <div class="main"><div class="in">
      <h1>내 실험 도감 ${doneCount()} / ${CARDS.length}</h1>
      <div class="dexhead">${all.map(b=>{const [e,nm]=b.split('|');return `<span class="badge ${have.includes(b)?'':'off'}">${e} ${nm}</span>`;}).join('')}</div>
      <div class="grid">${CARDS.map(c=>S.done[c.id]
        ?`<button class="tile" style="--cat:${CATS[c.cat].c}" data-act="open" data-id="${c.id}"><i></i><b>${c.e}</b><span>${c.t}</span></button>`
        :`<div class="tile lock"><i></i><b>❔</b><span>아직 안 한 실험</span></div>`).join('')}</div>
    </div></div>`;
  say([ko(`내 실험 도감이야. 지금까지 실험을 ${doneCount()}개 했어.`)]);
},
detail(){
  const c=CARDS.find(x=>x.id===viewArg),d=S.done[c.id];
  app.innerHTML=`<div class="top"><button class="round" data-act="dex" aria-label="도감으로">←</button><div class="grow"></div>
      <button class="round" data-act="again" aria-label="다시 듣기">🔊</button></div>
    <div class="main"><div class="in" style="--cat:${CATS[c.cat].c}">
      ${cardHTML(c)}<div style="height:26px"></div>
      <div class="why"><b>${c.o[c.a][0]}</b><span>${c.w}</span></div>
      <p class="note">${d.d.replace(/-/g,'. ')}에 처음 했어. 지금까지 ${d.n}번!</p>
    </div></div><div class="foot"><button class="btn" data-act="replay" data-id="${c.id}">또 해 보기</button></div>`;
  say([ko(c.t+' '+c.w)]);
},
parent(){
  const log=Object.entries(S.done).map(([id,d])=>({c:CARDS.find(x=>x.id===id),d})).filter(x=>x.c).sort((a,b)=>a.d.d<b.d.d?1:-1);
  const c=nextCard();
  app.innerHTML=`<div class="top"><button class="round" data-act="home" aria-label="처음으로">←</button><div class="grow"></div><div style="width:64px"></div></div>
    <div class="main"><div class="in parent">
      <h1>어른 화면</h1>
      ${storageOK?'':'<p class="miss">이 화면에서는 기록이 저장되지 않아요. 깃허브에 올린 주소를 사파리로 열고 홈 화면에 추가하면 저장됩니다.</p>'}
      <div class="panel">
        <div class="row"><label for="nm">아이 이름 (보글이가 불러 줘요)</label><input id="nm" type="text" maxlength="8" value="${esc(S.name)}" placeholder="예: 지우"></div>
        <div class="row"><span>소리 내어 읽어 주기</span><button class="sw" role="switch" aria-checked="${S.voice}" data-act="tg" data-k="voice" aria-label="소리 내어 읽어 주기"></button></div>
        <div class="row"><span>오늘의 영어 단어</span><button class="sw" role="switch" aria-checked="${S.english}" data-act="tg" data-k="english" aria-label="오늘의 영어 단어"></button></div>
        <div class="row"><span>하루 한 장이 기본이에요. 오늘 열린 카드 ${allowedToday()}장, 한 실험 ${doneToday()}개</span>
          <button class="pbtn" data-act="extra" ${c?'':'disabled'}>오늘 한 장 더 열기</button></div>
      </div>
      <h2>다음 실험 준비물</h2>
      <div class="panel"><p>${c?`<b>${c.e} ${c.t}</b><br>${c.m.map(m=>m[1]).join(', ')}<br>${c.tip}`:'모든 실험을 마쳤어요.'}</p></div>
      <h2>실험 기록</h2>
      <div class="panel">${log.length?`<table><tr><th>날짜</th><th>실험</th><th>예상</th><th>결과</th></tr>${log.map(x=>
        `<tr><td>${x.d.d.slice(5).replace('-','/')}</td><td>${x.c.e} ${x.c.t}${x.d.n>1?` (${x.d.n}번)`:''}</td><td>${x.c.o[x.d.p][1]}</td>
         <td class="${x.d.r===x.c.a?'':'miss'}">${x.c.o[x.d.r][1]}</td></tr>`).join('')}</table>
         <p style="margin-top:10px;font-size:14px">빨간 결과는 보통과 다르게 나온 실험이에요. 한 번 더 해 보기 좋은 카드입니다.</p>`
        :'<p>아직 기록이 없어요. 첫 실험을 하면 여기에 쌓여요.</p>'}</div>
      <h2>기록 지우기</h2>
      <div class="panel"><div class="row"><span>도감과 배지가 모두 사라져요.</span>
        <button class="pbtn warn" data-act="wipe">${wipeArmed?'정말 지울까요? 한 번 더 누르기':'기록 모두 지우기'}</button></div></div>
    </div></div>`;
  const nm=document.getElementById('nm');
  nm.addEventListener('input',()=>{S.name=nm.value.trim();save();});
}
};
function go(v,arg){view=v;viewArg=arg;if(v!=='parent')wipeArmed=false;V[v]();const m=app.querySelector('.main');if(m)m.scrollTop=0;}

function begin(card){
  const n=card.o.length,k=(CARDS.indexOf(card)+dayNum())%n;
  R={card,order:card.o.map((_,i)=>(i+k)%n),pred:null,res:null,newBadges:[]};
  go('prep');
}

/* ───────── 누르기 ───────── */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==='home'){try{speechSynthesis.cancel();}catch(_){ } go('home');}
  else if(a==='again')say(lastSay,true);
  else if(a==='start'){const c=nextCard();if(c)begin(c);}
  else if(a==='to')go(b.dataset.v);
  else if(a==='pred'){R.pred=+b.dataset.i;V.predict();say([ko(`${R.card.o[R.pred][1]}! 진짜 그런지 해 보자.`)]);}
  else if(a==='res'){R.res=+b.dataset.i;V.result();say([ko(`${R.card.o[R.res][1]}! 왜 그런지 알아볼까?`)]);}
  else if(a==='eng')say([{t:R.card.en[0],lang:'en-US'}],true);
  else if(a==='keep'){
    const before=earned(),id=R.card.id,old=S.done[id];
    S.done[id]=old?{d:old.d,p:R.pred,r:R.res,n:(old.n||1)+1}:{d:today(),p:R.pred,r:R.res,n:1};
    save();R.newBadges=earned().filter(x=>!before.includes(x));go('cheer');
  }
  else if(a==='dex')go('dex');
  else if(a==='open')go('detail',b.dataset.id);
  else if(a==='replay')begin(CARDS.find(c=>c.id===b.dataset.id));
  else if(a==='tg'){S[b.dataset.k]=!S[b.dataset.k];save();if(!S.voice){try{speechSynthesis.cancel();}catch(_){}}V.parent();}
  else if(a==='extra'){S.extra[today()]=(S.extra[today()]||0)+1;save();V.parent();}
  else if(a==='wipe'){
    if(!wipeArmed){wipeArmed=true;V.parent();}
    else{S.done={};S.extra={};save();wipeArmed=false;V.parent();}
  }
});

/* 어른 화면은 톱니를 1.5초 누르고 있어야 열려요 */
let holdT=null;
function holdOff(){clearTimeout(holdT);holdT=null;const g=app.querySelector('[data-hold]');if(g)g.classList.remove('holding');}
app.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-hold]');if(!g)return;
  g.classList.add('holding');holdT=setTimeout(()=>{holdOff();go('parent');},1500);
});
['pointerup','pointercancel','pointerleave'].forEach(t=>app.addEventListener(t,holdOff,true));
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

/* 날짜가 바뀌면 첫 화면을 새로 그려요 */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view==='home')V.home();});

go('home');

if('serviceWorker' in navigator&&location.protocol==='https:'){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
</script>
</body>
</html>
