<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>오늘의 실험</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오늘의 실험">
<meta name="theme-color" content="#FFCE3A">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --sun:#FFCE3A; --ink:#1C2541; --paper:#FFFDF5;
  --tomato:#F25C54; --sky:#3FA7F5; --leaf:#3DBE7B; --grape:#8C6BE8;
  --cat:var(--sky);
  --kid:'Jua','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --plain:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --fs-title:clamp(28px,6.2vmin,60px);
  --fs-body:clamp(20px,4vmin,38px);
  --fs-small:clamp(15px,2.1vmin,19px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--sun);color:var(--ink);font-family:var(--kid);
  overflow:hidden;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#app{
  height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 24px)
          calc(env(safe-area-inset-bottom,0px) + 20px) calc(env(safe-area-inset-left,0px) + 24px);
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--grape);outline-offset:3px}

/* 위쪽 줄 */
.top{display:flex;align-items:center;gap:14px;min-height:68px;flex:none}
.top .grow{flex:1;display:flex;justify-content:center}
.round{
  width:64px;height:64px;flex:none;border-radius:50%;border:4px solid var(--ink);
  background:var(--paper);box-shadow:0 5px 0 var(--ink);font-size:28px;line-height:1;
  display:grid;place-items:center;padding:0;position:relative;
}
.round:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.dots{display:flex;gap:10px}
.dots i{width:22px;height:22px;border-radius:50%;border:4px solid var(--ink);background:var(--paper)}
.dots i.on{background:var(--cat)}
.dots i.now{background:var(--ink)}

/* 가운데 */
.main{flex:1;min-height:0;overflow-y:auto;display:flex;-webkit-overflow-scrolling:touch}
.in{margin:auto;width:100%;max-width:1000px;text-align:center;padding:10px 4px 16px}
h1{font-size:var(--fs-title);font-weight:400;margin:0 0 .6em;line-height:1.25;word-break:keep-all;text-wrap:balance}
p{font-size:var(--fs-body);margin:0;line-height:1.45;word-break:keep-all;text-wrap:balance}

/* 아래 큰 버튼 */
.foot{flex:none;display:flex;justify-content:center;align-items:center;gap:18px;padding-top:14px;flex-wrap:wrap}
.btn{
  font-size:clamp(24px,3.8vmin,36px);min-height:80px;padding:.45em 1.5em;
  border:4px solid var(--ink);border-radius:999px;background:var(--leaf);color:#fff;
  box-shadow:0 8px 0 var(--ink);text-shadow:0 2px 0 rgba(28,37,65,.35);
}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.btn.plain{background:var(--paper);color:var(--ink);text-shadow:none}
.btn[disabled]{background:#E8E2CF;color:#9A957F;box-shadow:0 8px 0 #9A957F;border-color:#9A957F;text-shadow:none}

/* 실험 카드 */
.xcard{
  background:var(--paper);border:5px solid var(--ink);border-radius:30px;
  box-shadow:0 12px 0 var(--ink);overflow:hidden;width:min(100%,clamp(300px,56vmin,500px));margin:0 auto;
}
.xcard .band{background:var(--cat);color:#fff;font-size:clamp(18px,2.6vmin,24px);padding:.45em 1em;
  border-bottom:5px solid var(--ink);text-shadow:0 2px 0 rgba(28,37,65,.35)}
.xcard .pic{font-size:clamp(90px,24vmin,210px);line-height:1.2;padding:.08em 0 0}
.xcard .ttl{font-size:clamp(24px,4.8vmin,44px);padding:0 .6em .7em;line-height:1.25;word-break:keep-all}
.xcard.tilt{transform:rotate(-3deg)}
.xcard.wait{background:#F2E3A6;border-style:dashed;box-shadow:none;color:#6E612C}
.xcard.wait .pic,.xcard:not(.tilt):not(.wait) .pic{padding-top:.25em}

/* 첫 화면 */
.home{display:grid;gap:28px;align-items:center;justify-items:center}
@media (orientation:landscape) and (min-width:800px){.home{grid-template-columns:1fr 1fr}}
.buddy{display:flex;flex-direction:column;align-items:center;gap:6px}
.buddy svg{width:clamp(120px,28vmin,250px);height:auto}
.bubble{
  background:var(--paper);border:4px solid var(--ink);border-radius:26px;padding:.7em 1em;
  font-size:var(--fs-body);line-height:1.4;position:relative;max-width:520px;word-break:keep-all;text-wrap:balance;
}
.bubble::after{content:"";position:absolute;left:50%;bottom:-16px;width:24px;height:24px;margin-left:-12px;
  background:var(--paper);border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(45deg)}
.hold-hint{font-family:var(--plain);font-size:13px;font-weight:600;position:absolute;top:72px;right:-10px;width:84px;text-align:center;line-height:1.25;pointer-events:none}
.round.holding{background:var(--sky)}

/* 고르기 */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;margin-top:8px}
.opt{background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);
  padding:22px 12px 20px;font-size:clamp(22px,4vmin,38px);line-height:1.25;word-break:keep-all;min-height:clamp(150px,30vmin,260px)}
.opt b{display:block;font-size:clamp(54px,14vmin,124px);line-height:1.15;font-weight:400}
.opt:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
.opt.sel{background:var(--cat);color:#fff;text-shadow:0 2px 0 rgba(28,37,65,.35);transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}

/* 왜 그럴까 */
.verdict{font-size:var(--fs-body);margin-bottom:16px}
.why{background:var(--paper);border:4px solid var(--ink);border-radius:26px;padding:24px 28px;max-width:900px;margin:0 auto;
  font-size:var(--fs-body);line-height:1.5;word-break:keep-all;display:flex;gap:18px;align-items:center;text-align:left}
.why b{font-size:clamp(60px,11vmin,96px);font-weight:400;line-height:1;flex:none}
.note{font-size:clamp(18px,3vmin,28px);margin-top:16px}
.eng{margin-top:20px;display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);
  border:0;border-radius:999px;padding:14px 30px;font-size:clamp(22px,4vmin,38px)}
.eng small{font-size:.75em;opacity:.8}
.eng:active{transform:scale(.97)}

/* 축하 */
.pop{animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.2) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(-3deg);opacity:1}}
.newbadge{display:inline-flex;align-items:center;gap:12px;background:var(--paper);border:4px solid var(--ink);border-radius:999px;
  padding:8px 24px 8px 12px;font-size:var(--fs-body);margin-top:28px}
.newbadge b{font-size:1.5em;font-weight:400}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-30px;width:16px;height:24px;border-radius:4px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* 도감 */
.dexhead{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:22px}
.badge{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 16px 6px 10px;
  font-size:clamp(16px,2.3vmin,21px);display:inline-flex;gap:8px;align-items:center}
.badge.off{opacity:.38}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.tile{background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);
  padding:0 0 12px;overflow:hidden;font-size:clamp(16px,2.2vmin,20px);line-height:1.25;word-break:keep-all}
.tile i{display:block;height:16px;background:var(--cat);border-bottom:4px solid var(--ink)}
.tile b{display:block;font-size:clamp(46px,8vmin,64px);font-weight:400;line-height:1.3}
.tile span{display:block;padding:0 8px}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.tile.lock{background:#F2E3A6;box-shadow:none;border-style:dashed;color:#8A7A3A}
.tile.lock i{background:transparent;border-color:transparent}

/* 어른 화면 */
.parent{font-family:var(--plain);text-align:left;max-width:720px;-webkit-user-select:text;user-select:text}
.parent h1{font-family:var(--kid)}
.parent h2{font-size:20px;margin:28px 0 10px}
.parent p,.parent label,.parent td,.parent th{font-size:17px;line-height:1.5}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:16px 18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid rgba(28,37,65,.15)}
.row:last-child{border-bottom:0}
.parent input[type=text]{font:inherit;font-size:18px;padding:10px 12px;border:3px solid var(--ink);border-radius:12px;width:180px;
  background:#fff;-webkit-user-select:text;user-select:text}
.sw{width:64px;height:38px;border-radius:999px;border:3px solid var(--ink);background:#DDD6BE;position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--ink);transition:left .15s}
.sw[aria-checked=true]{background:var(--leaf)}
.sw[aria-checked=true]::after{left:29px}
.pbtn{font-family:var(--plain);font-size:16px;font-weight:600;padding:10px 16px;border:3px solid var(--ink);border-radius:12px;background:#fff}
.pbtn.warn{background:var(--tomato);color:#fff}
.pbtn:active{transform:translateY(2px)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid rgba(28,37,65,.15);vertical-align:top}
th{font-weight:600}
.miss{color:var(--tomato);font-weight:600}



.opt.no{opacity:.45;box-shadow:none;transform:translateY(5px);position:relative;animation:shake .4s}
.opt.no::after{content:"✕";position:absolute;right:14px;top:6px;font-size:44px;color:var(--tomato)}
@keyframes shake{25%{margin-left:-10px}75%{margin-left:10px}}
.retry{margin-top:22px}
.btn.ready{animation:bump .9s 3}
@keyframes bump{50%{transform:scale(1.08)}}

/* 실험 무대: 가로 1000, 세로 560 칸으로 그리고 화면에 맞춰 늘린다 */
.in.lab{margin:0;max-width:none;height:100%;display:flex;flex-direction:column;padding:0 0 4px}
.how{font-size:clamp(20px,3.6vmin,34px);font-weight:400;margin:0 0 12px;line-height:1.3;word-break:keep-all;text-wrap:balance}
.stagebox{flex:1;min-height:0;position:relative;touch-action:none}
.stage{position:absolute;width:1000px;height:560px;transform-origin:0 0;background:var(--paper);box-shadow:0 0 0 5px var(--ink);
  border-radius:26px;overflow:hidden;touch-action:none}
.stage.night{background:#2B3760}
.sp{position:absolute;left:0;top:0;line-height:1;text-align:center;pointer-events:none;z-index:2}
.sp.obj{pointer-events:auto;cursor:grab;z-index:3;touch-action:none}
.sp.obj.held{z-index:9}
.sp.obj.low,.sp.obj.low.held{z-index:3}
.sp.up{z-index:8}
.sp.pad{padding:22px}
.sp>i{margin-left:auto;margin-right:auto}
.sp small{display:block;font-size:24px;margin-top:4px;white-space:nowrap}
.sp.used{opacity:.4}
.sp.obj>.em,.sp.obj>i{animation:nudge 1s 3}
@keyframes nudge{50%{transform:scale(1.14)}}
.em{display:block;line-height:1.08}
.sv{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.sv.over{z-index:4}
.blob{display:block;border-radius:50%;border:5px solid var(--ink)}
.flag{font-size:54px}
.pop2{animation:pop2 .9s both;z-index:7}
@keyframes pop2{0%{opacity:0;margin-top:20px}30%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-30px}}

.tank{border:6px solid var(--ink);border-top:0;border-radius:0 0 26px 26px;z-index:5;pointer-events:none}
.water{background:#8FD3FF;border-radius:0 0 18px 18px;z-index:1;transition:background .5s}
.waterfront{background:rgba(63,167,245,.26);z-index:4;pointer-events:none;border-radius:0 0 18px 18px}
.fizz{border-radius:50%;background:rgba(255,255,255,.85);z-index:4;animation:fizz 3s linear infinite;pointer-events:none}
@keyframes fizz{to{transform:translateY(-285px);opacity:0}}
.grain{border-radius:50%;background:#fff;border:2px solid var(--ink);z-index:6;animation:drop .8s ease-in both;pointer-events:none}
.dropv{border-radius:50%;background:#FFE08A;border:2px solid var(--ink);z-index:6;animation:drop .8s ease-in both;pointer-events:none}
@keyframes drop{to{transform:translateY(150px);opacity:0}}

.plate{border-radius:50%;background:#fff;border:6px solid var(--ink);overflow:hidden;z-index:1}
.plate.dish{background:#CDEBFA}.plate.milk{background:#fff}
.paintmix{border-radius:50%}
.dot{display:block;border-radius:50%}
.mdot{opacity:.85;filter:blur(1.5px)}

.foam{border-radius:50%;background:#FF9B6A;border:4px solid var(--ink);z-index:6;animation:foam 2.6s ease-out both;pointer-events:none}
@keyframes foam{0%{transform:scale(.2)}25%{transform:translate(calc(var(--dx)*.25),var(--up)) scale(1)}100%{transform:translate(var(--dx),235px) scale(1.05)}}

.zone{width:120px;height:120px;border:5px dashed var(--ink);border-radius:50%;opacity:.45}
.towel{display:block;width:380px;height:26px;border-radius:10px;border:4px solid var(--ink);
  background:repeating-linear-gradient(90deg,#8C6BE8 0 20px,#B9A4F5 20px 40px)}

.wall{background:var(--paper);border:5px solid var(--ink);border-radius:12px;overflow:hidden;z-index:1}
.shade{position:absolute;left:50%;bottom:0;margin-left:-50px;width:100px;transform-origin:50% 100%;filter:brightness(0) blur(1.5px);opacity:.6;font-size:100px;line-height:1.08;text-align:center}
.torch{display:block;width:92px;height:46px;background:var(--tomato);border:5px solid var(--ink);border-radius:12px 4px 4px 12px;position:relative}
.torch::after{content:"";position:absolute;right:-34px;top:-16px;width:30px;height:68px;background:var(--sun);border:5px solid var(--ink);border-radius:4px 16px 16px 4px}

.pencil{display:block;width:28px;height:340px;border-radius:6px;border:4px solid var(--ink);
  background:linear-gradient(#FF7AA8 0 9%,#C9CCD6 9% 13%,#FFCE3A 13% 88%,#F2D2A0 88% 96%,#1C2541 96%)}
.lenswater{background:#BDE6FF;overflow:hidden;z-index:4;pointer-events:none;border-radius:0 0 18px 18px}
.glass{border:6px solid var(--ink);border-top:0;border-radius:0 0 26px 26px;z-index:5;pointer-events:none}
.sheet{background:#fff;border:4px solid var(--ink);border-radius:8px;z-index:1}
.arrow{display:block;width:230px;height:130px;background:var(--tomato);clip-path:polygon(0 30%,58% 30%,58% 0,100% 50%,58% 100%,58% 70%,0 70%)}
.lensglass{width:240px;height:340px;border:6px solid var(--ink);border-radius:18px 18px 36px 36px;background:#BDE6FF;overflow:hidden;position:relative}
.lensglass .gsheet{position:absolute;left:0;top:0;width:380px;height:300px;background:#fff}

.bit{display:block;width:28px;height:22px;background:#fff;border:3px solid var(--ink);border-radius:4px}
.meter{font-size:40px;z-index:7}
.glow>.em{filter:drop-shadow(0 0 16px #FFD400)}
.nope::after{content:"✕";position:absolute;right:-6px;top:-10px;font-size:40px;color:var(--tomato)}

.tray{display:block;width:460px;height:22px;background:#C98B5E;border:5px solid var(--ink);border-radius:11px}
.sheetflat{display:block;width:150px;height:14px;background:#fff;border:4px solid var(--ink);border-radius:4px}
.crumple{display:block;width:72px;height:66px;background:#fff;border:4px solid var(--ink);border-radius:46% 54% 40% 60%/55% 42% 58% 45%}

.swab{display:block;width:18px;height:170px;background:#fff;border:4px solid var(--ink);border-radius:9px;position:relative}
.swab::after{content:"";position:absolute;left:-9px;bottom:-10px;width:28px;height:36px;border-radius:50%;background:var(--leaf);border:4px solid var(--ink)}
.soapy::after{content:"";position:absolute;left:50%;top:-4px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--leaf);border:3px solid var(--ink)}

.paperc{background:#fff;box-shadow:0 0 0 5px var(--ink);border-radius:4px;z-index:1}

.cup{border:6px solid var(--ink);border-top:0;border-radius:0 0 28px 28px;overflow:hidden;background:rgba(255,255,255,.7);z-index:2;cursor:pointer;touch-action:none}
.cupw{background:#8FD3FF}
.ring{animation:ring .45s}
@keyframes ring{25%{transform:rotate(2.5deg)}75%{transform:rotate(-2.5deg)}}

.gbox{background:#F2B279;border:6px solid var(--ink);border-radius:26px;z-index:1}
.peg{display:block;width:40px;height:40px;border-radius:50%;background:var(--ink)}
.peg.knob{background:var(--sun);border:6px solid var(--ink);width:70px;height:70px}
.grip{display:block;width:84px;height:84px;border-radius:50%;border:5px dashed var(--ink);background:rgba(255,255,255,.55)}

.pier{background:#C9CCD6;border:5px solid var(--ink);border-radius:8px;z-index:1}
.deck{background:#fff;border:4px solid var(--ink);z-index:2;transition:transform .5s ease-in,height .2s}
.deck.sag{height:28px !important;border-radius:0 0 50% 50%/0 0 100% 100%}
.deck.broken{transform:translateY(192px) rotate(5deg)}
.blk{display:block;width:62px;height:62px;border-radius:10px;border:5px solid var(--ink)}
.count small{font-size:38px;margin:0}

.seg{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pbtn.on{background:var(--ink);color:#fff}
.parent select{font:inherit;font-size:16px;padding:8px;border:3px solid var(--ink);border-radius:12px;background:#fff;max-width:240px}

@media (prefers-reduced-motion:reduce){.pop,.confetti i,.btn.ready,.sp.obj>.em,.sp.obj>i{animation:none}.confetti{display:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ───────── 실험 카드 ─────────
   q 예상 질문 / o 보기 / a 정답 / how 실험 방법 / rq 실험 뒤 질문 / w 까닭 / en 영어 단어 / sim 실험 무대 */
const CATS={
  water:{name:'물 실험',e:'💧',c:'#3FA7F5'},
  color:{name:'색깔 실험',e:'🎨',c:'#FF7AA8'},
  light:{name:'빛 실험',e:'🔦',c:'#FF9F1C'},
  air:{name:'공기 실험',e:'🎈',c:'#35B8C9'},
  force:{name:'힘 실험',e:'🚗',c:'#F25C54'},
  sound:{name:'소리 실험',e:'🎵',c:'#8C6BE8'},
  kitchen:{name:'부엌 실험',e:'🧪',c:'#3DBE7B'}
};
const CARDS=[
{id:'apple',cat:'water',e:'🍎',t:'사과는 물에 뜰까?',
 q:'사과를 물에 넣으면 어떻게 될까?',o:[['⬆️','둥둥 뜬다'],['⬇️','가라앉는다']],a:0,
 how:'사과랑 돌멩이를 끌어서 물에 퐁당 넣어 봐!',rq:'사과는 어떻게 됐어?',
 w:'사과 속에는 작은 공기 방이 아주 많아. 그래서 물보다 가벼워서 둥둥 떠.',en:['float','뜨다'],
 sim:{type:'tank',items:[{e:'🍎',f:'float'},{e:'🪨',f:'sink'}]}},

function dayNum(){const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);}

function earned(){

   아이패드에 들어 있는 목소리를 쓰고, 높낮이와 빠르기로 아이 같은 말투를 만든다 */
const TONES={calm:[1.1,0.95,'차분하게'],play:[1.55,1.06,'장난꾸러기'],tiny:[2,1.02,'꼬마']};
let lastSay=[];
function clean(t){return t.replace(/[\u{1F000}-\u{1FFFF}\u{2190}-\u{2BFF}\u{3030}\u{303D}\u{FE0F}\u{200D}]/gu,' ');}
function koVoices(){try{return speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang||''));}catch(e){return [];}}
function pickVoice(lang){
  try{
    if(lang==='ko-KR'){const ks=koVoices();return ks.find(v=>v.name===S.vname)||ks[0]||null;}
    const vs=speechSynthesis.getVoices().filter(v=>(v.lang||'').replace('_','-').startsWith(lang.slice(0,2)));
    return vs.find(v=>v.lang.replace('_','-')===lang)||vs[0]||null;
  }catch(e){return null;}
}
function say(parts,force){
  lastSay=parts;
  if((!S.voice&&!force)||!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const tn=TONES[S.tone]||TONES.play;
    parts.forEach(p=>{
      const lang=p.lang||'ko-KR',u=new SpeechSynthesisUtterance(clean(p.t));
      u.lang=lang;u.pitch=tn[0];u.rate=lang==='ko-KR'?tn[1]:0.8;
      const v=pickVoice(lang);if(v)u.voice=v;
      speechSynthesis.speak(u);
    });
  }catch(e){}
}
const ko=t=>({t});
if('speechSynthesis' in window){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{if(view==='parent')V.parent();};}catch(e){}}

let AC=null;
function tone(f,dur,type,vol,delay){
  if(!S.voice)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(vol||0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+(dur||0.4));
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(dur||0.4)+0.05);
  }catch(e){}
}
const sfxGood=()=>{tone(660,.16,'triangle',.22);tone(990,.35,'triangle',.22,.14);};
const sfxBad=()=>{tone(220,.22,'square',.07);tone(180,.3,'square',.07,.18);};

/* ───────── 실험 무대 도구 ───────── */
const SW=1000,SH=560;
let sim=null;
function openStage(host,onDone){
  const st=document.createElement('div');st.className='stage';host.appendChild(st);
  const me={st,alive:true,done:false,offs:[]};
  const fit=()=>{
    const w=host.clientWidth-12,h=host.clientHeight-12,k=Math.max(0.1,Math.min(w/SW,h/SH));
    st.style.transform=`scale(${k})`;st.style.left=(host.clientWidth-SW*k)/2+'px';st.style.top=(host.clientHeight-SH*k)/2+'px';
  };
  fit();window.addEventListener('resize',fit);me.offs.push(()=>window.removeEventListener('resize',fit));
  me.finish=()=>{if(me.done||!me.alive)return;me.done=true;onDone();};
  sim=me;return me;
}
function closeStage(){if(sim){sim.alive=false;sim.offs.forEach(f=>f());sim=null;}}
function sp(html,x,y,cls){
  const d=document.createElement('div');d.className='sp '+(cls||'');d.innerHTML=html;sim.st.appendChild(d);
  d.rot=0;d.sc=1;d.fx=1;
  d.at=(x,y)=>{d.x=x;d.y=y;d.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) rotate(${d.rot}deg) scale(${d.sc*d.fx},${d.sc})`;return d;};
  return d.at(x,y);
}
function box(cls,x,y,w,h,parent){
  const d=document.createElement('div');d.className=cls;
  d.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  (parent||sim.st).appendChild(d);return d;
}
function svg(inner,cls){
  const d=document.createElement('div');d.className='sv '+(cls||'');
  d.innerHTML=`<svg viewBox="0 0 ${SW} ${SH}" width="${SW}" height="${SH}">${inner}</svg>`;
  sim.st.appendChild(d);return d.firstChild;
}
const em=(e,size)=>`<span class="em" style="font-size:${size}px">${e}</span>`;
function pt(e){const r=sim.st.getBoundingClientRect(),k=r.width/SW;return {x:(e.clientX-r.left)/k,y:(e.clientY-r.top)/k};}
function drag(d,o){
  o=o||{};
  d.addEventListener('pointerdown',e=>{
    if(d.locked||d.held||!sim)return;
    e.preventDefault();try{d.setPointerCapture(e.pointerId);}catch(_){}
    const p=pt(e),ox=d.x-p.x,oy=d.y-p.y;d.held=true;d.classList.add('held');d.style.transition='';
    if(o.start)o.start(d);
    const mv=ev=>{
      if(!sim)return;
      const q=pt(ev);let x=Math.max(20,Math.min(SW-20,q.x+ox)),y=Math.max(20,Math.min(SH-20,q.y+oy));
      if(o.axis==='x')y=d.y;if(o.axis==='y')x=d.x;
      if(o.clamp)[x,y]=o.clamp(x,y);
      d.at(x,y);if(o.move)o.move(d,x,y);
    };
    const up=()=>{
      d.held=false;d.classList.remove('held');
      d.removeEventListener('pointermove',mv);d.removeEventListener('pointerup',up);d.removeEventListener('pointercancel',up);
      if(sim&&o.end)o.end(d);
    };
    d.addEventListener('pointermove',mv);d.addEventListener('pointerup',up);d.addEventListener('pointercancel',up);
  });
}
function glide(d,x,y,ms){
  ms=ms||350;d.style.transition=`transform ${ms}ms cubic-bezier(.3,1.3,.5,1)`;d.at(x,y);
  setTimeout(()=>{if(!d.held)d.style.transition='';},ms+30);
}
function loop(fn){
  const me=sim;let t0=performance.now();
  (function f(t){if(!me.alive)return;const dt=Math.min(0.05,Math.max(0,(t-t0)/1000));t0=t;fn(dt,t/1000);requestAnimationFrame(f);})(t0);
}
function later(ms,fn){const me=sim;setTimeout(()=>{if(me.alive)fn();},ms);}
const now=()=>performance.now()/1000;
function mixHex(a,b,p){
  const h=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)),x=h(a),y=h(b);
  return 'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*p)).join(',')+')';
}
const FLOOR=y=>`<line x1="30" y1="${y}" x2="970" y2="${y}" stroke="#1C2541" stroke-width="6" stroke-linecap="round"/>`;

const SIM={};

/* 물통: 물건을 넣으면 뜨거나 가라앉는다 */
SIM.tank=c=>{
  const L=380,Rr=950,T=110,B=520,surf=210;
  box('water',L+6,surf,Rr-L-12,B-surf-6).style.background=c.liquid||'';
  const wb=sim.st.querySelector('.water');
  if(c.soda)for(let i=0;i<16;i++){
    const b=box('fizz',L+30+Math.random()*(Rr-L-70),B-24,10,10);
    b.style.animationDelay=(-Math.random()*3)+'s';b.style.animationDuration=(2+Math.random()*2)+'s';
  }
  box('waterfront',L+6,surf,Rr-L-12,B-surf-6);box('tank',L,T,Rr-L,B-T);
  let salt=0,salty=false;
  const n=c.items.length+(c.salt?1:0),ys=n===1?[300]:n===2?[190,400]:[130,290,450];
  const items=c.items.map((it,i)=>{
    const size=it.s||100;
    const d=sp((it.blob?`<i class="blob" style="background:${it.blob};width:${size}px;height:${size}px"></i>`:em(it.e,size))+(it.n?`<small>${it.n}</small>`:''),190,ys[i],'obj');
    d.it=it;d.size=size;d.hy=ys[i];d.vy=0;d.inW=false;
    drag(d,{start(){d.vy=0;},end(){
      if(d.x>L+30&&d.x<Rr-30&&d.y>T-60){d.inW=true;d.t0=now();d.at(Math.max(L+12+size/2,Math.min(Rr-12-size/2,d.x)),d.y);}
      else{d.inW=false;glide(d,190,d.hy);}
    }});
    return d;
  });
  let lab=null;
  if(c.salt){
    const sy=ys[n-1],sh=sp(em('🧂',96)+'<small>소금</small>',190,sy,'obj');
    lab=sp('<small></small>',(L+Rr)/2,T+34,'count');
    drag(sh,{end(){
      if(sh.x>L&&sh.x<Rr&&sh.y>T-80){
        salt++;for(let i=0;i<10;i++){const g=box('grain',sh.x-30+Math.random()*60,sh.y+30,9,9);g.style.animationDelay=(i*0.04)+'s';later(1100,()=>g.remove());}
        tone(900,.08,'triangle',.1);
        if(salt>=3&&!salty){salty=true;wb.style.background='#BFD9E6';tone(660,.3,'triangle',.2,.2);}
        lab.firstChild.textContent=salty?'짭짤한 소금물이 됐어!':`소금 ${salt}번`;
      }
      glide(sh,190,sy);
    }});
  }
  loop((dt,t)=>{
    let all=true;
    items.forEach((d,i)=>{
      if(!d.inW){all=false;return;}
      let f=d.it.f;if(f==='salt')f=salty?'float':'sink';
      const bottom=B-12-d.size*0.5,top=surf+d.size*0.14+Math.sin(t*2+i)*4;
      let target=f==='sink'?bottom:top;
      if(f==='dance'){const ph=(t-d.t0+i*0.7)%5;target=ph<1.8?bottom:ph<4?top:bottom;}
      if(!d.held){
        if(d.y<surf-d.size*0.4)d.vy+=1700*dt;
        else d.vy+=((target-d.y)*26-d.vy*5.5)*dt;
        let y=d.y+d.vy*dt;if(y>bottom){y=bottom;d.vy=0;}
        d.at(d.x,y);
      }
      if(d.it.f==='dance'){if(t-d.t0>5)d.ok=true;}
      else if(d.it.f==='salt'){if(salty&&Math.abs(d.y-top)<16&&!d.held)d.ok=true;}
      else if(Math.abs(d.y-target)<16&&Math.abs(d.vy)<40&&!d.held&&t-d.t0>0.6)d.ok=true;
      if(!d.ok)all=false;
    });
    if(all)sim.finish();
  });
};

/* 미끄럼틀: 높이를 바꾸거나 길에 수건을 깐다 */
SIM.ramp=c=>{
  const gx=150,ex=450,gy=480,HM=c.mode==='height';
  let h=HM?90:170,towel=false,running=false;const runs={},flags=[];
  const s=svg(FLOOR(gy)+`<polygon id="rp" fill="#F2B279" stroke="#1C2541" stroke-width="6" stroke-linejoin="round"/>`);
  const rp=s.querySelector('#rp'),zone=sp('',0,0,'zone');
  const car=sp(em('🚗',92),ex+150,gy-42,'obj up');car.fx=-1;car.at(car.x,car.y);
  let book=null,tw=null;
  const draw=()=>{rp.setAttribute('points',`${gx},${gy} ${gx},${gy-h} ${ex},${gy}`);zone.at(gx+52,gy-h-34);if(book&&!book.held)book.at(gx-62,gy-h+10);};
  if(HM){
    book=sp(em('📚',84)+'<small>↕ 높이</small>',gx-62,gy-h+10,'obj');
    drag(book,{axis:'y',clamp:(x,y)=>[x,Math.max(gy-250,Math.min(gy-60,y))],move(d,x,y){if(!running){h=gy-y+10;draw();}}});
  }else{
    tw=sp('<i class="towel"></i><small>수건</small>',720,90,'obj pad');
    drag(tw,{end(){
      if(tw.y>gy-170){towel=true;glide(tw,720,gy-2);tw.lastChild.style.visibility='hidden';}
      else{towel=false;glide(tw,720,90);tw.lastChild.style.visibility='';}
    }});
  }
  draw();
  drag(car,{start(){car.rot=0;},end(){
    if(running)return;
    if(Math.hypot(car.x-zone.x,car.y-zone.y)<150)run();
    else glide(car,Math.max(ex+60,car.x),gy-42);
  }});
  let rs=null;
  function run(){
    running=true;car.locked=true;if(book)book.locked=true;if(tw)tw.locked=true;
    const sx=gx+50,sy=gy-h+(50*h/(ex-gx))-40;
    rs={sx,sy,t0:now(),D:HM?40+h*1.72:(towel?150:470),T1:0.95-h*0.0012};rs.T2=0.5+rs.D/420;
    car.rot=Math.atan2(h,ex-gx)*180/Math.PI;car.at(sx,sy);tone(140+h,.5,'sawtooth',.04);
  }
  loop((dt,t)=>{
    if(!rs)return;
    const el=t-rs.t0;
    if(el<rs.T1){const u=(el/rs.T1)*(el/rs.T1);car.at(rs.sx+(ex-rs.sx)*u,rs.sy+(gy-42-rs.sy)*u);return;}
    car.rot=0;const u=Math.min(1,(el-rs.T1)/rs.T2),x=ex+rs.D*(1-(1-u)*(1-u));car.at(x,gy-42);
    if(u>=1){
      rs=null;running=false;car.locked=false;if(book)book.locked=false;if(tw)tw.locked=false;
      const f=sp(em('🚩',54),x+10,gy-36,'flag');flags.push(f);if(flags.length>4)flags.shift().remove();
      tone(880,.15,'triangle',.15);
      if(HM){if(h<140)runs.lo=1;if(h>190)runs.hi=1;}else runs[towel?'t':'f']=1;
      if(HM?(runs.lo&&runs.hi):(runs.t&&runs.f))later(500,sim.finish);
    }
  });
};

/* 화살표: 물컵 너머로 보면 좌우가 바뀐다 */

/* 끌어당기기: 자석, 그리고 문지른 풍선 */
SIM.attract=c=>{
  const tool=sp(em(c.tool,124),150,190,'obj up');
  let charge=c.rub?0:1,rubbed=0,px=tool.x,meter=null;
  if(c.rub){sp(em('🧒',180),830,170,'');meter=sp('',150,70,'meter');}
  const n=c.objs.length;
  const objs=c.objs.map((o,i)=>{
    const x=o.x||(360+i*(520/Math.max(1,n-1))),y=o.y||440;
    const d=sp(o.bit?'<i class="bit"></i>':em(o.e,o.s||96),x,y,'');d.o=o;d.hx=x;d.hy=y;return d;
  });
  drag(tool,{move(d,x,y){
    if(c.rub&&charge<1&&Math.hypot(x-830,y-150)<170){
      rubbed+=Math.abs(x-px);charge=Math.min(1,rubbed/900);meter.textContent='⚡'.repeat(Math.ceil(charge*3));
      if(charge>=1){tool.classList.add('glow');tone(880,.3,'triangle',.2);}
    }
    px=x;if(meter)meter.at(x,y-110);
  }});
  loop((dt,t)=>{
    let all=true,stuck=0;
    objs.forEach(d=>{
      if(d.stuck){d.at(d.x+(tool.x+d.ox-d.x)*0.35,d.y+(tool.y+d.oy-d.y)*0.35);stuck++;return;}
      const dist=Math.hypot(tool.x-d.x,tool.y+c.oy-d.y);
      if(d.o.pull){
        if(charge>=1&&dist<170){d.stuck=true;d.ox=(Math.random()-0.5)*76;d.oy=c.oy+(Math.random()-0.5)*40;d.style.zIndex=9;tone(1200,.07,'square',.06);}
        else all=false;
      }else if(dist<120){d.tested=true;d.classList.add('nope');d.at(d.hx+Math.sin(t*38)*3,d.hy);}
      else if(!d.tested)all=false;
    });
    if(c.rub?stuck>=5:all)sim.finish();
  });
};

/* 종이 떨어뜨리기: 받침대를 빼면 둘이 같이 떨어진다 */
SIM.fall=c=>{
  const ty=120,gy=500;svg(FLOOR(gy));
  const flat=sp('<i class="sheetflat"></i>',380,ty-24,''),ball=sp('<i class="crumple"></i>',620,ty-48,'');
  const tray=sp('<i class="tray"></i><small>옆으로 쏙!</small>',500,ty+16,'obj pad');
  let state='ready',t0=0,medal=null;

    if(state==='ready'&&Math.abs(x-500)>190){state='fall';t0=now();tone(500,.1,'triangle',.12);}
  },end(){
    if(state==='ready')glide(tray,500,ty+16);
    else if(state==='landed'){
      state='ready';if(medal){medal.remove();medal=null;}
      flat.rot=0;glide(flat,380,ty-24);glide(ball,620,ty-48);glide(tray,500,ty+16);
    }
  }});
  loop((dt,t)=>{
    if(state!=='fall')return;
    const el=t-t0,by=Math.min(gy-36,ty-48+0.5*1500*el*el),fyy=Math.min(gy-10,ty-24+155*el);
    if(by>=gy-36&&!medal){medal=sp(em('🥇',60),620,gy-110,'flag');tone(880,.2,'triangle',.2);}

    if(fyy<gy-10){flat.rot=Math.sin(el*4)*14;flat.at(380+Math.sin(el*4)*52,fyy);}
    else{flat.rot=0;flat.at(flat.x,gy-10);state='landed';tone(440,.2,'triangle',.15);later(500,sim.finish);}
  });
};

/* 접시 위 알갱이: 세제가 닿으면 바깥으로 달아난다 */
SIM.scatter=c=>{
  const cx=570,cy=285,r=228,ps=[];
  box('plate '+(c.milk?'milk':'dish'),cx-r,cy-r,2*r,2*r);
  const mk=(x,y,col,s)=>{const d=sp(`<i class="dot ${c.milk?'mdot':''}" style="width:${s}px;height:${s}px;background:${col}"></i>`,x,y,'');d.vx=d.vy=0;ps.push(d);};
  if(c.milk)['#F25C54','#3FA7F5','#FFCE3A','#3DBE7B'].forEach((col,k)=>{
    const a0=k*Math.PI/2+0.6;
    for(let i=0;i<24;i++){const rr=Math.random()*40,a=Math.random()*7;mk(cx+Math.cos(a0)*62+Math.cos(a)*rr,cy+Math.sin(a0)*62+Math.sin(a)*rr,col,22+Math.random()*18);}
  });
  else for(let i=0;i<90;i++){const a=Math.random()*7,rr=Math.sqrt(Math.random())*190;mk(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,'#3B2F2F',5+Math.random()*6);}
  const tool=c.milk?sp('<i class="swab"></i>',130,280,'obj up pad'):sp(em('👆',116),130,330,'obj up soapy');
  let fired=0,touching=false;
  const tip=()=>c.milk?{x:tool.x,y:tool.y+85}:{x:tool.x,y:tool.y-50};
  function fire(p){
    const pow=fired?0.2:1;fired++;
    ps.forEach(d=>{
      const dx=d.x-p.x,dy=d.y-p.y,Ln=Math.hypot(dx,dy)||1,v=(c.milk?380:680)*pow*(c.milk?0.25+Math.random():0.55+Math.random()*0.7);
      d.vx+=dx/Ln*v-(c.milk?dy/Ln*v*0.55:0);d.vy+=dy/Ln*v+(c.milk?dx/Ln*v*0.55:0);
    });
    if(fired===1){tone(600,.25,'triangle',.18);tone(900,.3,'triangle',.14,.1);later(1900,sim.finish);}
  }
  // 가운데 가까이 오면 바로, 아니면 접시 안에서 손을 뗄 때 세제가 닿는다
  const touch=lim=>{const p=tip();if(Math.hypot(p.x-cx,p.y-cy)<lim){if(!touching){touching=true;fire(p);}}else touching=false;};
  drag(tool,{move(){touch(r*0.4);},end(){touch(r-30);touching=false;}});
  loop(dt=>{
    const fr=Math.pow(c.milk?0.1:0.03,dt),lim=r-24;
    ps.forEach(d=>{
      if(Math.abs(d.vx)+Math.abs(d.vy)<3)return;
      let x=d.x+d.vx*dt,y=d.y+d.vy*dt;const Ln=Math.hypot(x-cx,y-cy);
      if(Ln>lim){x=cx+(x-cx)/Ln*lim;y=cy+(y-cy)/Ln*lim;d.vx*=0.2;d.vy*=0.2;}
      d.vx*=fr;d.vy*=fr;d.at(x,y);
    });
  });
};

/* 숨은 그림: 물감을 칠하면 흰 크레파스 그림이 드러난다 */
SIM.reveal=c=>{

  const g=cv.getContext('2d');g.lineCap='round';g.lineJoin='round';g.lineWidth=74;g.strokeStyle='rgba(63,167,245,.9)';
  let star='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?58:135;star+=(i?'L':'M')+(190+Math.cos(a)*rr).toFixed(0)+' '+(225+Math.sin(a)*rr).toFixed(0)+' ';}
  svg(`<g transform="translate(${X},${Y})" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="${star}Z"/><circle cx="465" cy="225" r="115"/><path d="M415 255 Q465 310 515 255"/>
    <path d="M425 190 v12 M505 190 v12"/></g>`,'over');
  const brush=sp(em('🖌️',124),140,300,'obj up');
  const cells=new Set();let last=null;
  drag(brush,{start(){last=null;},move(d,x,y){
    const tx=x-46-X,ty=y+46-Y;
    if(tx>0&&tx<W&&ty>0&&ty<H){
      g.beginPath();g.moveTo(last?last.x:tx,last?last.y:ty);g.lineTo(tx+0.1,ty);g.stroke();
      last={x:tx,y:ty};cells.add(Math.floor(tx/80)+'_'+Math.floor(ty/88));

/* 물컵 실로폰: 물이 많을수록 낮은 소리 */
SIM.xylo=c=>{
  const cups=[{x:320,lv:0.22,f:880,ic:'🐦'},{x:560,lv:0.55,f:660},{x:800,lv:0.9,f:440,ic:'🐻'}],hits=new Set();
  function hit(k){
    tone(k.f,1.1,'sine',.3);tone(k.f*2.01,.5,'sine',.07);
    k.el.classList.remove('ring');void k.el.offsetWidth;k.el.classList.add('ring');
    if(k.ic){const s=sp(em(k.ic,74),k.x,150,'pop2');later(900,()=>s.remove());}
    hits.add(k);if(hits.size===3)later(900,sim.finish);
  }
  cups.forEach(k=>{
    k.el=box('cup',k.x-85,210,170,280);
    const w=document.createElement('div');w.className='cupw';w.style.cssText=`position:absolute;left:0;right:0;bottom:0;height:${k.lv*100}%`;k.el.appendChild(w);
    k.el.addEventListener('pointerdown',()=>hit(k));
  });
  const spoon=sp(em('🥄',112),130,130,'obj up');let inside=null;
  drag(spoon,{move(d,x,y){
    const k=cups.find(k=>Math.abs(x-k.x)<100&&y>190&&y<510)||null;
    if(k&&k!==inside)hit(k);inside=k;
  },end(){inside=null;}});
};

/* 고무줄 기타: 팽팽할수록 높은 소리 */
SIM.band=c=>{
  const ax=190,y0=290;
  box('gbox',120,170,530,240);
  const s=svg(`<path id="bd" fill="none" stroke="#F25C54" stroke-linecap="round"/>`,'over'),path=s.querySelector('#bd');
  sp('<i class="peg"></i>',ax,y0,'');
  const peg=sp('<i class="peg knob"></i><small>↔ 팽팽하게</small>',700,y0+18,'obj up pad');
  const grip=sp('<i class="grip"></i>',(ax+700)/2,y0,'obj up');
  let pull=0,vib=null,loose=false,tight=false;
  const ten=()=>(peg.x-700)/200;
  drag(peg,{axis:'x',clamp:(x,y)=>[Math.max(700,Math.min(900,x)),y]});
  drag(grip,{axis:'y',clamp:(x,y)=>[x,Math.max(y0-120,Math.min(y0+120,y))],start(){vib=null;pull=0;},move(d,x,y){pull=y-y0;},end(){
    if(Math.abs(pull)>18){
      const T=ten(),f=165+T*330;vib={amp:pull,t0:now()};tone(f,1.2,'triangle',.3);tone(f*2,.4,'sine',.08);
      const ic=sp(em(T>0.6?'🐦':T<0.35?'🐻':'🎵',70),grip.x,y0-150,'pop2');later(900,()=>ic.remove());
      if(T<0.3)loose=true;if(T>0.7)tight=true;if(loose&&tight)later(1100,sim.finish);
    }
    pull=0;
  }});
  loop((dt,t)=>{
    const mx=(ax+peg.x)/2;let off=grip.held?pull:0;
    if(vib){const el=t-vib.t0;off=vib.amp*Math.exp(-el*3)*Math.cos(el*(16+ten()*34));if(el>1.7)vib=null;}
    if(!grip.held)grip.at(mx,y0+off);else grip.at(mx,grip.y);
    path.setAttribute('d',`M${ax} ${y0} Q${mx} ${y0+off*2} ${peg.x} ${y0}`);path.setAttribute('stroke-width',15-ten()*9);
  });
};

/* 풍선 로켓: 누르고 있으면 커지고, 떼면 날아간다 */
SIM.rocket=c=>{
  const hx=150,hy=410,gy=500;svg(FLOOR(gy));
  const b=sp(em('🎈',112),hx,hy,'obj up');b.sc=0.6;b.at(hx,hy);
  let state='idle',size=0.6,fl=null;const flags=[];
  b.addEventListener('pointerdown',e=>{if(state!=='idle')return;e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}state='blow';});
  const rel=()=>{if(state!=='blow')return;if(size<0.85){state='idle';return;}state='fly';fl={t0:now(),pow:size};tone(320,.6,'sawtooth',.05);};
  b.addEventListener('pointerup',rel);b.addEventListener('pointercancel',rel);
  loop((dt,t)=>{
    if(state==='blow'){size=Math.min(2.2,size+dt*0.75);b.sc=size;b.at(hx+Math.sin(t*30)*1.5,hy-(size-0.6)*42);}
    else if(state==='idle'&&size>0.6){size=Math.max(0.6,size-dt*2);b.sc=size;b.at(hx,hy);}
    else if(state==='fly'){
      const el=t-fl.t0,dur=0.6+fl.pow*0.8,u=Math.min(1,el/dur),dist=80+(fl.pow-0.6)/1.6*690;
      const x=hx+dist*(1-(1-u)*(1-u)),y=hy-Math.sin(u*Math.PI)*(110+fl.pow*60)+Math.sin(el*18)*16*(1-u);
      size=fl.pow-(fl.pow-0.6)*u;b.sc=size;b.rot=90;b.at(x,y);
      if(Math.random()<0.45&&u<0.9){const p=sp(em('💨',40),x-60,y,'pop2');later(600,()=>p.remove());}
      if(u>=1){
        state='land';b.rot=0;b.at(x,hy);
        const f=sp(em('🚩',54),x,gy-36,'flag');flags.push(f);if(flags.length>4)flags.shift().remove();
        tone(880,.15,'triangle',.15);sim.finish();
        later(1300,()=>{size=0.6;b.sc=0.6;b.at(hx,hy);state='idle';});
      }
    }
  });
};

/* 종이 다리: 평평한 종이와 접은 종이에 블록 올리기 */
SIM.bridge=c=>{
  const dy=300,gy=510;
  const br=[{x:250,cap:1,n:0,flat:1,its:[]},{x:750,cap:9,n:0,its:[]}];
  let zig='';for(let i=0;i<=14;i++)zig+=(750-175+i*25)+','+(i%2?dy-28:dy)+' ';
  svg(FLOOR(gy)+`<polyline points="${zig}" fill="none" stroke="#1C2541" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="${zig}" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`);
  br.forEach(b=>{
    box('pier',b.x-185,dy,62,gy-dy);box('pier',b.x+123,dy,62,gy-dy);
    if(b.flat)b.el=box('deck',b.x-180,dy-10,360,12);
    b.lab=sp('<small>0개</small>',b.x,170,'count');
  });
  ['#F25C54','#3FA7F5','#3DBE7B','#8C6BE8','#FF9F1C','#FF7AA8','#35B8C9'].forEach((col,i)=>{
    const hx=215+i*95,d=sp(`<i class="blk" style="background:${col}"></i>`,hx,70,'obj');
    drag(d,{end(){
      const b=br.find(b=>Math.abs(d.x-b.x)<170&&d.y>110);
      if(!b){glide(d,hx,70);return;}
      d.locked=true;
      if(b.broken){glide(d,d.x,gy-36,300);return;}
      b.n++;
      if(b.n>b.cap){
        b.broken=true;b.el.classList.remove('sag');b.el.classList.add('broken');b.lab.firstChild.textContent='와르르!';sfxBad();
        b.its.concat(d).forEach((q,j)=>{q.style.transition='transform .45s ease-in';q.at(b.x-60+j*110,gy-36);});
      }else{
        const top=b.flat?dy-8:dy-32,j=b.n-1;
        glide(d,b.x-68+(j%3)*68,top-33-Math.floor(j/3)*64,250);b.its.push(d);
        if(b.flat)b.el.classList.add('sag');
        b.lab.firstChild.textContent=b.n+'개';tone(500+b.n*60,.12,'triangle',.15);
      }
      if(br[0].broken&&br[1].n>=3)later(700,sim.finish);
    }});
  });
};

      <h1>${c.e} ${c.q}</h1>
      <div class="opts">${R.order.map(i=>`<button class="opt ${R.pred===i?'sel':''}" data-act="pred" data-i="${i}"><b>${c.o[i][0]}</b>${c.o[i][1]}</button>`).join('')}</div>
    </div></div><div class="foot"><button class="btn" data-act="to" data-v="doit" ${picked?'':'disabled'}>실험하러 가기</button></div>`;
  if(!picked)say([ko(`${c.q} 네 생각은 뭐야? 골라 봐!`)]);
},
doit(){
  const c=R.card;
  app.innerHTML=`${flowTop(1)}<div class="main"><div class="in lab" style="--cat:${CATS[c.cat].c}">
      <h2 class="how">${c.how}</h2><div class="stagebox" id="sb"></div>
    </div></div><div class="foot"><button class="btn" id="fin" data-act="to" data-v="result" disabled>실험 끝!</button></div>`;
  const me=openStage(document.getElementById('sb'),()=>{
    const f=document.getElementById('fin');if(f){f.disabled=false;f.classList.add('ready');}
    sfxGood();say([ko(['우와, 봤어?','오호~ 신기하지?','짜잔~ 봤지?'][Math.floor(Math.random()*3)]+' 더 놀아도 되고, 다 봤으면 실험 끝 버튼을 눌러!')]);
  });
  if(c.sim.type==='shadow')me.st.classList.add('night');
  SIM[c.sim.type](c.sim);
  say([ko(c.how)]);
},
result(){
  const c=R.card,ok=R.res===c.a,miss=!ok&&R.bad.length>0;
  app.innerHTML=`${flowTop(2)}<div class="main"><div class="in" style="--cat:${CATS[c.cat].c}">
      <h1>${c.rq}</h1>
      <div class="opts">${R.order.map(i=>{const no=R.bad.includes(i);
        return `<button class="opt ${ok&&i===c.a?'sel':''} ${no?'no':''}" data-act="res" data-i="${i}" ${ok||no?'disabled':''}><b>${c.o[i][0]}</b>${c.o[i][1]}</button>`;}).join('')}</div>
      ${ok?'<p class="retry">딩동댕~ 맞았어!</p>':miss?'<p class="retry">음~ 다시 한번 생각해 봐!</p>':''}
    </div></div><div class="foot">${miss?'<button class="btn plain" data-act="to" data-v="doit">실험 다시 보기</button>':''}
      <button class="btn" data-act="to" data-v="why" ${ok?'':'disabled'}>왜 그럴까?</button></div>`;
  if(!ok)say([ko(c.rq+' 본 대로 골라 봐!')]);
},
why(){
  const c=R.card,same=R.pred===c.a;
  const verdict=same?'우와, 처음 예상이 딱 맞았네! 대단해!':'처음 예상이랑은 달랐지? 그래서 실험이 재밌는 거야!';
  app.innerHTML=`${flowTop(3)}<div class="main"><div class="in" style="--cat:${CATS[c.cat].c}">
      <p class="verdict">${verdict}</p>
      <div class="why"><b>${c.o[c.a][0]}</b><span>${c.w}</span></div>
      ${S.english?`<div><button class="eng" data-act="eng">🔊 ${c.en[0]} <small>${c.en[1]}</small></button></div>`:''}
    </div></div><div class="foot"><button class="btn" data-act="keep">도감에 넣기</button></div>`;
  const parts=[ko(verdict+' '+c.w)];
  if(S.english)parts.push(ko(`${c.en[1]}. 영어로는`),{t:c.en[0],lang:'en-US'});
  say(parts);
},
cheer(){
  const c=R.card,nb=R.newBadges||[];
  const conf=Array.from({length:26},(_,i)=>`<i style="left:${(i*37)%100}%;background:${['#F25C54','#3FA7F5','#3DBE7B','#8C6BE8','#FFFDF5','#FF7AA8'][i%6]};animation-delay:${(i%9)*0.12}s"></i>`).join('');
  app.innerHTML=`<div class="confetti">${conf}</div><div class="top"></div><div class="main"><div class="in">
      <h1>도감에 새 카드가 쏙!</h1>
      <div class="pop">${cardHTML(c)}</div>
      ${nb.map(b=>{const [e,nm]=b.split('|');return `<div><span class="newbadge"><b>${e}</b>새 배지, ${nm}</span></div>`;}).join('')}
    </div></div><div class="foot"><button class="btn" data-act="home">처음으로</button><button class="btn plain" data-act="dex">📒 내 도감 ${doneCount()}</button></div>`;
  sfxGood();say([ko('야호! 도감에 새 카드가 쏙 들어갔어!'+(nb.length?' 새 배지도 받았어. '+nb.map(b=>b.split('|')[1]).join(', ')+'!':''))]);
},
dex(){
  const have=earned(),all=[...BADGES.map(b=>b[1]+'|'+b[2]),...Object.values(CATS).map(k=>k.e+'|'+k.name+' 박사')];
  app.innerHTML=`<div class="top"><button class="round" data-act="home" aria-label="처음으로">←</button><div class="grow"></div><div style="width:64px"></div></div>
    <div class="main"><div class="in">
      <h1>내 실험 도감 ${doneCount()} / ${CARDS.length}</h1>
      <div class="dexhead">${all.map(b=>{const [e,nm]=b.split('|');return `<span class="badge ${have.includes(b)?'':'off'}">${e} ${nm}</span>`;}).join('')}</div>
      <div class="grid">${CARDS.map(c=>S.done[c.id]
        ?`<button class="tile" style="--cat:${CATS[c.cat].c}" data-act="open" data-id="${c.id}"><i></i><b>${c.e}</b><span>${c.t}</span></button>`
        :`<div class="tile lock"><i></i><b>❔</b><span>아직 안 한 실험</span></div>`).join('')}</div>
    </div></div>`;
  say([ko(`내 실험 도감이야. 지금까지 실험을 ${doneCount()}개 했어. 카드를 누르면 또 할 수 있어!`)]);
},
detail(){
  const c=CARDS.find(x=>x.id===viewArg),d=S.done[c.id];
  app.innerHTML=`<div class="top"><button class="round" data-act="dex" aria-label="도감으로">←</button><div class="grow"></div>
      <button class="round" data-act="again" aria-label="다시 듣기">🔊</button></div>
    <div class="main"><div class="in" style="--cat:${CATS[c.cat].c}">
      ${cardHTML(c)}<div style="height:26px"></div>
      <div class="why"><b>${c.o[c.a][0]}</b><span>${c.w}</span></div>
      <p class="note">${d.d.replace(/-/g,'. ')}에 처음 했어. 지금까지 ${d.n}번!</p>
    </div></div><div class="foot"><button class="btn" data-act="replay" data-id="${c.id}">또 해 보기</button></div>`;
  say([ko(c.t+' '+c.w)]);
},
parent(){
  const log=CARDS.filter(c=>S.done[c.id]).map(c=>({c,d:S.done[c.id]})).sort((a,b)=>a.d.d<b.d.d?1:-1);
  const vs=koVoices();
  app.innerHTML=`<div class="top"><button class="round" data-act="home" aria-label="처음으로">←</button><div class="grow"></div><div style="width:64px"></div></div>
    <div class="main"><div class="in parent">
      <h1>어른 화면</h1>
      ${storageOK?'':'<p class="miss">이 화면에서는 기록이 저장되지 않아요. 깃허브에 올린 주소를 사파리로 열고 홈 화면에 추가하면 저장됩니다.</p>'}
      <div class="panel">
        <div class="row"><label for="nm">아이 이름 (보글이가 불러 줘요)</label><input id="nm" type="text" maxlength="8" value="${esc(S.name)}" placeholder="예: 지우"></div>
        <div class="row"><span>소리 (읽어 주기와 효과음)</span><button class="sw" role="switch" aria-checked="${S.voice}" data-act="tg" data-k="voice" aria-label="소리"></button></div>
        <div class="row"><span>보글이 말투</span><div class="seg">${Object.keys(TONES).map(k=>`<button class="pbtn ${S.tone===k?'on':''}" data-act="tone" data-k="${k}">${TONES[k][2]}</button>`).join('')}</div></div>
        ${vs.length>1?`<div class="row"><label for="vs">목소리 고르기</label><select id="vs">${vs.map(v=>`<option value="${esc(v.name)}" ${v.name===S.vname?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div>`:''}
        <div class="row"><span>지금 목소리로 한마디 들어 보기</span><button class="pbtn" data-act="hear">들어 보기</button></div>
        <div class="row"><span>오늘의 영어 단어</span><button class="sw" role="switch" aria-checked="${S.english}" data-act="tg" data-k="english" aria-label="오늘의 영어 단어"></button></div>
        <div class="row"><span>하루 한 장이 기본이에요. 오늘 열린 카드 ${allowedToday()}장, 한 실험 ${doneToday()}개</span>
          <button class="pbtn" data-act="extra" ${nextCard()?'':'disabled'}>오늘 한 장 더 열기</button></div>
      </div>
      <h2>실험 기록</h2>
      <div class="panel">${log.length?`<table><tr><th>날짜</th><th>실험</th><th>처음 예상</th><th>실험 뒤 질문</th></tr>${log.map(x=>
        `<tr><td>${x.d.d.slice(5).replace('-','/')}</td><td>${x.c.e} ${x.c.t}${x.d.n>1?` (${x.d.n}번)`:''}</td>
         <td class="${x.d.p===x.c.a?'':'miss'}">${x.c.o[x.d.p]?x.c.o[x.d.p][1]:''}</td>
         <td class="${x.d.w?'miss':''}">${x.d.w?`${x.d.w}번 틀리고 맞힘`:'바로 맞힘'}</td></tr>`).join('')}</table>
         <p style="margin-top:10px;font-size:14px">빨간 글씨는 예상이 빗나갔거나 질문에서 헷갈린 실험이에요. 도감에서 다시 해 보기 좋은 카드입니다.</p>`
        :'<p>아직 기록이 없어요. 첫 실험을 하면 여기에 쌓여요.</p>'}</div>
      <h2>기록 지우기</h2>
      <div class="panel"><div class="row"><span>도감과 배지가 모두 사라져요.</span>
        <button class="pbtn warn" data-act="wipe">${wipeArmed?'정말 지울까요? 한 번 더 누르기':'기록 모두 지우기'}</button></div></div>
    </div></div>`;
  const nm=document.getElementById('nm');nm.addEventListener('input',()=>{S.name=nm.value.trim();save();});
  const sel=document.getElementById('vs');if(sel)sel.addEventListener('change',()=>{S.vname=sel.value;save();hear();});
}
};
function hear(){say([ko('안녕! 나는 보글이야. 오늘도 신나는 실험 하자!')],true);}
function go(v,arg){closeStage();view=v;viewArg=arg;if(v!=='parent')wipeArmed=false;V[v]();const m=app.querySelector('.main');if(m)m.scrollTop=0;}
function begin(card){
  const n=card.o.length,k=(CARDS.indexOf(card)+dayNum())%n;
  R={card,order:card.o.map((_,i)=>(i+k)%n),pred:null,res:null,bad:[],newBadges:[]};
  go('predict');
}

/* ───────── 누르기 ───────── */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==='home'){try{speechSynthesis.cancel();}catch(_){ } go('home');}
  else if(a==='again')say(lastSay,true);
  else if(a==='start'){const c=nextCard();if(c)begin(c);}
  else if(a==='to')go(b.dataset.v);
  else if(a==='pred'){R.pred=+b.dataset.i;V.predict();say([ko(`오호~ ${R.card.o[R.pred][1]}! 진짜 그런지 실험해 보자!`)]);}
  else if(a==='res'){
    const i=+b.dataset.i;
    if(i===R.card.a){R.res=i;sfxGood();V.result();say([ko('딩동댕~ 맞았어! 왜 그런지 알아볼까?')]);}
    else{if(!R.bad.includes(i))R.bad.push(i);sfxBad();V.result();say([ko('음~ 다시 한번 생각해 봐! 실험을 다시 봐도 돼.')]);}
  }
  else if(a==='eng')say([{t:R.card.en[0],lang:'en-US'}],true);
  else if(a==='keep'){
    const before=earned(),id=R.card.id,old=S.done[id];
    S.done[id]=old?{d:old.d,p:old.p,w:old.w,n:(old.n||1)+1}:{d:today(),p:R.pred,w:R.bad.length,n:1};
    save();R.newBadges=earned().filter(x=>!before.includes(x));go('cheer');
  }
  else if(a==='dex')go('dex');
  else if(a==='open')go('detail',b.dataset.id);
  else if(a==='replay')begin(CARDS.find(c=>c.id===b.dataset.id));
  else if(a==='tg'){S[b.dataset.k]=!S[b.dataset.k];save();if(!S.voice){try{speechSynthesis.cancel();}catch(_){}}V.parent();}
  else if(a==='tone'){S.tone=b.dataset.k;save();V.parent();hear();}
  else if(a==='hear')hear();
  else if(a==='extra'){S.extra[today()]=(S.extra[today()]||0)+1;save();V.parent();}
  else if(a==='wipe'){
    if(!wipeArmed){wipeArmed=true;V.parent();}
    else{S.done={};S.extra={};save();wipeArmed=false;V.parent();}
  }
});

/* 어른 화면은 톱니를 1.5초 누르고 있어야 열려요 */
let holdT=null;
function holdOff(){clearTimeout(holdT);holdT=null;const g=app.querySelector('[data-hold]');if(g)g.classList.remove('holding');}
app.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-hold]');if(!g)return;
  g.classList.add('holding');holdT=setTimeout(()=>{holdOff();go('parent');},1500);
});
['pointerup','pointercancel'].forEach(t=>app.addEventListener(t,holdOff,true));
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.target.closest&&e.target.closest('.stage'))e.preventDefault();},{passive:false});

/* 날짜가 바뀌면 첫 화면을 새로 그려요 */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view==='home')V.home();});

go('home');

if('serviceWorker' in navigator&&location.protocol==='https:'){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
</script>
</body>
</html>
